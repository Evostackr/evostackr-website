    <!-- Critical Anti-FOUC & Skeleton Loading Engine -->
    <style id="evostackr-critical-css">
      :root {
        --color-brand-primary: #111827;
        --color-brand-secondary: #172554;
        --color-brand-accent: #1E3A5F;
        --color-bg: #F5F6F5;
        --color-surface: #E8EBE9;
        --color-surface-alt: #DDE1DF;
        --color-border: #D9DCDA;
        --color-text-secondary: #525658;
        --page-margin: clamp(1.25rem, 5vw, 6rem);
        --max-width: 1400px;
        --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #F5F6F5;
        color: #111827;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: var(--font-primary);
        background-color: var(--color-bg);
        color: var(--color-brand-primary);
        overflow-x: hidden;
      }
      .app-loaded {
        animation: appFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes appFadeIn {
        from { opacity: 0.85; }
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loaded {
          animation: none !important;
        }
      }

      /* ─── Skeleton Loading System ─── */
      .skeleton-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background-color: var(--color-bg);
      }
      .skeleton-container {
        width: 100%;
        max-width: var(--max-width);
        margin-left: auto;
        margin-right: auto;
        padding-left: var(--page-margin);
        padding-right: var(--page-margin);
      }
      .sk-shimmer {
        background: linear-gradient(
          90deg,
          #E8EBE9 0%,
          #F2F4F2 35%,
          #E8EBE9 70%
        );
        background-size: 200% 100%;
        animation: sk-wave 2s ease-in-out infinite;
      }
      @keyframes sk-wave {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk-shimmer {
          animation: none !important;
          background: #E8EBE9 !important;
        }
      }

      /* Header Skeleton */
      .sk-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3.75rem;
        background-color: rgba(245, 246, 245, 0.94);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--color-border);
        z-index: 100;
        display: flex;
        align-items: center;
      }
      .sk-nav__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 100%;
      }
      .sk-nav__brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .sk-nav__logo {
        width: 28px;
        height: 28px;
        border-radius: 2px;
        border: 1px solid var(--color-border);
      }
      .sk-nav__name {
        width: 78px;
        height: 16px;
        border-radius: 2px;
      }
      .sk-nav__links {
        display: flex;
        align-items: center;
        gap: 2rem;
      }
      .sk-nav__link {
        height: 12px;
        border-radius: 2px;
      }
      .sk-nav__cta {
        width: 108px;
        height: 34px;
        background: #111827;
        border-radius: 2px;
      }
      .sk-nav__burger {
        display: none;
        width: 24px;
        height: 18px;
        flex-direction: column;
        justify-content: space-between;
      }
      .sk-nav__burger-bar {
        width: 100%;
        height: 2px;
        background-color: #111827;
        border-radius: 1px;
      }

      /* Hero Section Skeleton */
      .sk-hero {
        padding-top: calc(3.75rem + clamp(2rem, 3.5vw, 3rem));
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .sk-hero__grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4rem;
        align-items: center;
      }
      .sk-hero__content {
        max-width: 600px;
      }
      .sk-eyebrow {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }
      .sk-eyebrow__line {
        width: 24px;
        height: 1px;
        background-color: #111827;
      }
      .sk-eyebrow__text {
        width: 220px;
        height: 12px;
        border-radius: 2px;
      }
      .sk-headline {
        margin-bottom: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .sk-headline__l1 {
        width: 320px;
        max-width: 90%;
        height: clamp(2.5rem, 4vw, 3.5rem);
        border-radius: 2px;
      }
      .sk-headline__l2 {
        width: 210px;
        max-width: 70%;
        height: clamp(2.5rem, 4vw, 3.5rem);
        border-radius: 2px;
      }
      .sk-subheadline {
        width: 170px;
        height: 22px;
        margin-bottom: 1rem;
        border-radius: 2px;
      }
      .sk-description {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 2.5rem;
        max-width: 420px;
      }
      .sk-description__l1 {
        width: 100%;
        height: 14px;
        border-radius: 2px;
      }
      .sk-description__l2 {
        width: 82%;
        height: 14px;
        border-radius: 2px;
      }
      .sk-actions {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .sk-btn--primary {
        width: 180px;
        height: 44px;
        background-color: #111827;
        border-radius: 2px;
      }
      .sk-btn--secondary {
        width: 130px;
        height: 44px;
        border: 1px solid var(--color-border);
        background-color: var(--color-surface);
        border-radius: 2px;
      }

      /* Hero Visual Skeleton */
      .sk-hero__visual {
        display: flex;
        justify-content: flex-end;
        align-items: center;
      }
      .sk-visual-frame {
        width: 100%;
        max-width: 480px;
        aspect-ratio: 1 / 1;
        border: 1px solid var(--color-border);
        background-color: var(--color-surface);
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
      }
      .sk-visual-terminal-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--color-border);
        padding-bottom: 0.75rem;
      }
      .sk-visual-tag {
        width: 90px;
        height: 10px;
        border-radius: 2px;
      }
      .sk-visual-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #111827;
      }
      .sk-visual-body {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin: auto 0;
      }
      .sk-visual-code-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .sk-visual-chart {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 120px;
        padding-top: 1rem;
      }
      .sk-visual-bar {
        flex: 1;
        border-radius: 1px;
      }
      .sk-visual-footer {
        display: flex;
        justify-content: space-between;
        padding-top: 0.75rem;
        border-top: 1px solid var(--color-border);
      }

      /* Statistics Skeleton */
      .sk-hero__bottom {
        margin-top: auto;
        padding-bottom: 2rem;
      }
      .sk-stats {
        display: flex;
        gap: 4rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--color-border);
      }
      .sk-stat {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .sk-stat__label {
        width: 110px;
        height: 10px;
        border-radius: 2px;
      }
      .sk-stat__val {
        width: 65px;
        height: 18px;
        border-radius: 2px;
      }

      /* Products Skeleton */
      .sk-products {
        padding-top: 6rem;
        padding-bottom: 6rem;
        border-top: 1px solid var(--color-border);
      }
      .sk-products__header {
        max-width: 560px;
        margin-bottom: 3.5rem;
      }
      .sk-products__title {
        width: 280px;
        height: 36px;
        margin-bottom: 0.75rem;
        border-radius: 2px;
      }
      .sk-products__subtitle {
        width: 380px;
        max-width: 90%;
        height: 16px;
        border-radius: 2px;
      }
      .sk-products__grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      .sk-card {
        border: 1px solid var(--color-border);
        background-color: var(--color-bg);
        overflow: hidden;
      }
      .sk-card--featured {
        display: flex;
        flex-direction: column;
      }
      .sk-card__visual {
        width: 100%;
        aspect-ratio: 1900 / 875;
        background-color: var(--color-surface);
        border-bottom: 1px solid var(--color-border);
      }
      .sk-card__content {
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .sk-products__supporting {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
      }
      .sk-card--compact .sk-card__visual {
        height: 180px;
        background-color: var(--color-surface);
        border-bottom: 1px solid var(--color-border);
      }

      /* Responsive Breakpoints */
      @media (max-width: 1024px) {
        .sk-hero {
          padding-top: calc(3.75rem + 2rem);
          min-height: auto;
        }
        .sk-hero__grid {
          grid-template-columns: 1fr;
          gap: 3rem;
        }
        .sk-hero__visual {
          justify-content: center;
          order: -1;
        }
        .sk-visual-frame {
          max-width: 380px;
        }
      }

      @media (max-width: 768px) {
        .sk-nav__links,
        .sk-nav__cta {
          display: none;
        }
        .sk-nav__burger {
          display: flex;
        }
        .sk-hero {
          padding-top: calc(3.75rem + 1.5rem);
          padding-bottom: 2rem;
        }
        .sk-hero__visual {
          order: 2;
          margin-top: 1.5rem;
          width: 100%;
        }
        .sk-visual-frame {
          max-width: 300px;
        }
        .sk-actions {
          flex-direction: column;
          gap: 0.75rem;
        }
        .sk-btn--primary,
        .sk-btn--secondary {
          width: 100%;
          justify-content: center;
        }
        .sk-stats {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 1.5rem;
        }
        .sk-hero__bottom {
          margin-top: 2.5rem;
        }
        .sk-products__supporting {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 480px) {
        .sk-hero {
          padding-top: calc(3.75rem + 1rem);
          padding-bottom: 1.5rem;
        }
      }
